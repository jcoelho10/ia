server:
  port: 8080

spring:
  application:
    name: ai-guardrail-gateway
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:
        - id: ai-guardrail-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - StripPrefix=3
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5     # 5 requisicoes por segundo
                redis-rate-limiter.burstCapacity: 10    # Pico de até 10 requisições
                key-resolver: "#{@userKeyResolver}"

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, gateway
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      aiServiceCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms